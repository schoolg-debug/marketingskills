<title>Skin Bench</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0A0C14; --bg2:#0D101B; --panel:#12152290; --panel-s:#121522; --raised:#1A1E30; --raised2:#20253C;
    --line:rgba(150,163,214,.11); --line2:rgba(150,163,214,.2);
    --ink:#EAECF8; --dim:#8E95B5; --faint:#5C6284;
    --violet:#8F7DF8; --violet2:#B7A8FF; --violet-dim:rgba(143,125,248,.14);
    --teal:#3ED6B5; --teal-dim:rgba(62,214,181,.13);
    --amber:#EFB95C; --amber-dim:rgba(239,185,92,.13);
    --gray:#9AA3C0; --gray-dim:rgba(154,163,192,.13);
    --red:#F0797F; --red-dim:rgba(240,121,127,.13);
    --orange:#EE9A5F; --orange-dim:rgba(238,154,95,.14);
    --blue:#6FA9F5; --blue-dim:rgba(111,169,245,.13);
    --pink:#EF7FBE;
    --r-lg:20px; --r-md:14px; --r-sm:9px;
    --font-d:'Sora',ui-sans-serif,system-ui,sans-serif;
    --font-b:'Albert Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-m:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-b);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  ::selection{background:rgba(143,125,248,.35)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  a{color:var(--violet2)}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ================= SHELL ================= */
  #stage{min-height:100vh;background:
    radial-gradient(900px 480px at 85% -10%,rgba(143,125,248,.13),transparent 60%),
    radial-gradient(700px 420px at -10% 30%,rgba(62,214,181,.06),transparent 55%),
    var(--bg);}
  #app{display:flex;flex-direction:column;min-height:100vh}

  /* phone frame on wide viewports */
  body.phone #stage{padding:28px 16px;display:flex;justify-content:center;align-items:flex-start}
  @media(min-width:760px){
    body.phone #app{
      width:414px;height:min(880px,calc(100vh - 56px));min-height:0;border-radius:48px;
      border:1px solid var(--line2);outline:8px solid #05060B;box-shadow:0 40px 90px rgba(0,0,0,.6);
      overflow:hidden;background:var(--bg);position:relative;
    }
  }
  @media(max-width:759px){ body.phone #stage{padding:0} }
  body.desktop #stage{padding:0}
  body.desktop #app{max-width:1440px;margin:0 auto}

  /* ================= HEADER ================= */
  header.top{
    display:flex;align-items:center;gap:14px;padding:14px 20px;
    position:sticky;top:0;z-index:40;
    background:rgba(10,12,20,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand .mark{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
    background:linear-gradient(135deg,#8F7DF8,#5E4FD0);box-shadow:0 4px 14px rgba(143,125,248,.35);
  }
  .brand b{font-family:var(--font-d);font-weight:700;font-size:16px;letter-spacing:.01em}
  .brand small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .searchbox{flex:1;max-width:520px;position:relative}
  .searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .searchbox input{
    width:100%;padding:9px 14px 9px 36px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel-s);color:var(--ink);font-size:14px;transition:border-color .2s;
  }
  .searchbox input::placeholder{color:var(--faint)}
  .searchbox input:focus{border-color:var(--violet);outline:none}
  .hspace{flex:1}
  /* mode switch */
  .modeswitch{
    display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--panel-s);
    border:1px solid var(--line);flex-shrink:0;
  }
  .modeswitch button{
    display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;
    font-size:12.5px;font-weight:600;color:var(--dim);transition:all .22s;
  }
  .modeswitch button.on{background:var(--raised2);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.35)}
  body.phone .modeswitch button span.lbl{display:none}
  body.phone header.top{padding:12px 16px}
  body.phone .brand small{display:none}
  body.phone .searchbox{display:none}

  /* phone sticky search below header */
  .psearch{display:none;padding:10px 16px 4px;position:sticky;top:63px;z-index:30;
    background:linear-gradient(rgba(10,12,20,.85),rgba(10,12,20,.6) 80%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  body.phone .psearch{display:block}
  .psearch input{width:100%;padding:10px 16px 10px 38px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel-s);color:var(--ink);font-size:14px}
  .psearch{position:relative}
  .psearch .wrap{position:relative}
  .psearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}

  /* ================= LAYOUT ================= */
  .frame{flex:1;display:flex;min-height:0}
  body.phone .frame{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  body.phone .frame::-webkit-scrollbar{display:none}
  nav.side{
    width:230px;flex-shrink:0;padding:18px 12px 32px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:2px;position:sticky;top:63px;align-self:flex-start;
    max-height:calc(100vh - 63px);overflow-y:auto;
  }
  body.phone nav.side{display:none}
  .navlab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:14px 12px 6px;font-family:var(--font-d)}
  .navlab:first-child{padding-top:2px}
  nav.side button{
    display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:10px;
    font-size:13.5px;font-weight:500;color:var(--dim);transition:background .15s,color .15s;text-align:left;
  }
  nav.side button:hover{background:rgba(150,163,214,.06);color:var(--ink)}
  nav.side button.on{background:var(--violet-dim);color:var(--violet2);font-weight:600}
  nav.side button .ico{width:18px;text-align:center;flex-shrink:0}
  nav.side button .n{margin-left:auto;font-family:var(--font-m);font-size:11px;color:var(--faint);
    background:rgba(150,163,214,.08);padding:1px 7px;border-radius:20px}
  nav.side button.on .n{color:var(--violet2);background:rgba(143,125,248,.16)}

  main{flex:1;min-width:0;padding:22px 26px 60px}
  body.phone main{padding:8px 16px 110px}

  /* ================= BOTTOM NAV (phone) ================= */
  .bottomnav{display:none}
  body.phone .bottomnav{
    display:flex;position:sticky;bottom:0;z-index:50;margin-top:auto;
    background:rgba(13,15,26,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  }
  @media(min-width:760px){ body.phone .bottomnav{position:absolute;left:0;right:0;bottom:0} }
  .bottomnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
    color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.02em;border-radius:12px;transition:color .18s;
  }
  .bottomnav button svg{transition:transform .2s}
  .bottomnav button.on{color:var(--violet2)}
  .bottomnav button.on svg{transform:translateY(-1px)}

  /* ================= COMMON COMPONENTS ================= */
  .view{animation:vin .3s ease}
  @keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1.vtitle{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .vsub{color:var(--dim);font-size:13.5px;max-width:640px;margin-top:4px}
  .vhead{margin-bottom:18px}
  .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--violet2);font-weight:700;font-family:var(--font-d);margin-bottom:6px}

  .card{background:var(--panel-s);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:20px;
    font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .pill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .p-g{background:var(--teal-dim);color:var(--teal)} .p-g .dot{background:var(--teal)}
  .p-y{background:var(--amber-dim);color:var(--amber)} .p-y .dot{background:var(--amber)}
  .p-w{background:var(--gray-dim);color:var(--gray)} .p-w .dot{background:var(--gray)}
  .p-r{background:var(--red-dim);color:var(--red)} .p-r .dot{background:var(--red)}
  .p-o{background:var(--orange-dim);color:var(--orange)} .p-o .dot{background:var(--orange)}
  .p-b{background:var(--blue-dim);color:var(--blue)} .p-b .dot{background:var(--blue)}
  .p-v{background:var(--violet-dim);color:var(--violet2)} .p-v .dot{background:var(--violet)}
  .p-m{background:var(--gray-dim);color:var(--gray)} .p-m .dot{background:var(--teal)}

  /* chips row */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
  body.phone .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}
  body.phone .chips::-webkit-scrollbar{display:none}
  .chip{
    padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel-s);
    font-size:12.5px;font-weight:600;color:var(--dim);white-space:nowrap;transition:all .18s;flex-shrink:0;
  }
  .chip:hover{border-color:var(--line2);color:var(--ink)}
  .chip.on{background:var(--violet-dim);border-color:rgba(143,125,248,.45);color:var(--violet2)}

  /* stat strip */
  .statstrip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stat{
    flex:1;min-width:130px;background:var(--panel-s);border:1px solid var(--line);border-radius:var(--r-md);
    padding:12px 15px;
  }
  .stat .k{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.03em;display:flex;align-items:center;gap:6px}
  .stat .v{font-family:var(--font-d);font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px;color:var(--faint);font-weight:500;font-family:var(--font-b)}
  body.phone .statstrip{gap:8px}
  body.phone .stat{min-width:calc(50% - 4px)}

  /* coverage bar */
  .covbar{height:9px;border-radius:6px;overflow:hidden;display:flex;background:var(--raised);margin:10px 0 8px}
  .covbar i{height:100%;display:block}
  .covleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .covleg b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .covleg .sw{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:5px}

  /* ================= TABLE (desktop) ================= */
  .tablewrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel-s)}
  .tscroll{overflow-x:auto}
  table.bench{width:100%;border-collapse:collapse;font-size:13.5px;min-width:840px}
  table.bench th{
    text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);font-family:var(--font-d);
    background:rgba(150,163,214,.03);white-space:nowrap;
  }
  table.bench td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  table.bench tr:last-child td{border-bottom:0}
  table.bench tr:hover td{background:rgba(150,163,214,.035)}
  td.prod{font-weight:600;max-width:290px}
  td.why{color:var(--dim);font-size:12.5px;max-width:400px;min-width:220px}
  td.wcol{color:var(--dim);white-space:nowrap;font-size:12.5px}
  .slotchip{font-size:11.5px;color:var(--dim);white-space:nowrap}

  /* ================= PRICE ================= */
  .pcol{white-space:nowrap;font-variant-numeric:tabular-nums}
  .pnow{font-family:var(--font-d);font-weight:700;font-size:14px}
  .pwas{font-size:11px;color:var(--faint);text-decoration:line-through;margin-left:5px}
  .psize{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.02em;margin-top:1px}
  .psale{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--teal);
    background:var(--teal-dim);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}
  .pest{border-bottom:1px dotted var(--faint);cursor:help}
  .punk{font-size:11.5px;color:var(--faint);font-style:italic}
  .qcol{white-space:nowrap;font-variant-numeric:tabular-nums;min-width:150px}
  .qtot{font-family:var(--font-d);font-weight:600;font-size:13.5px;color:var(--violet2)}
  .qunits{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
  .qone{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--teal);background:var(--teal-dim);border-radius:5px;padding:2px 6px}
  .qmany{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--amber);background:var(--amber-dim);border-radius:5px;padding:2px 6px}
  .qnote{display:block;font-size:11px;color:var(--dim);margin-top:5px;line-height:1.45;white-space:normal;max-width:260px}
  .delta{font-size:10.5px;font-weight:700;margin-left:6px;font-variant-numeric:tabular-nums}
  .dup{color:var(--red)} .ddn{color:var(--teal)}
  .priceline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:9px;
    padding-top:9px;border-top:1px dashed var(--line)}
  .priceline .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}

  /* price watch */
  .refreshbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel-s);
    border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px}
  .refreshbar .dotlive{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0;
    box-shadow:0 0 0 0 rgba(62,214,181,.6);animation:pulse 2.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,214,181,.5)}70%{box-shadow:0 0 0 9px rgba(62,214,181,0)}100%{box-shadow:0 0 0 0 rgba(62,214,181,0)}}
  .refreshbar b{font-family:var(--font-d);font-size:13px}
  .refreshbar span{font-size:12px;color:var(--dim)}
  .refreshbar .stamp{margin-left:auto;font-family:var(--font-m);font-size:11px;color:var(--faint)}
  body.phone .refreshbar .stamp{margin-left:0;width:100%}
  .spendgrid{display:grid;gap:10px;margin-bottom:18px}
  body.desktop .spendgrid{grid-template-columns:repeat(4,1fr)}
  body.phone .spendgrid{grid-template-columns:1fr 1fr}
  .spend{background:var(--panel-s);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
  .spend .sk{font-size:11px;color:var(--dim);font-weight:600}
  .spend .sv{font-family:var(--font-d);font-size:23px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .spend .sn{font-size:11px;color:var(--faint);margin-top:2px}
  .cartrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .cartrow:last-child{border-bottom:0}
  .cartrow .cn{flex:1;font-size:13.5px;font-weight:500;min-width:0}
  .cartrow .cn small{display:block;color:var(--faint);font-size:11px;font-weight:400;margin-top:1px}
  .cartrow .cq{font-family:var(--font-m);font-size:12px;color:var(--dim);white-space:nowrap}
  .cartrow .cp{font-family:var(--font-d);font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .savebox{border:1px solid rgba(62,214,181,.3);background:linear-gradient(180deg,rgba(62,214,181,.07),transparent);
    border-radius:var(--r-lg);padding:16px 18px;margin:18px 0}
  .savebox h3{font-family:var(--font-d);font-size:14.5px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
  .savebox p{font-size:12.5px;color:var(--dim)}
  .savelist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .saveitem{display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--dim);
    background:rgba(62,214,181,.05);border-radius:10px;padding:9px 12px}
  .saveitem b{color:var(--ink);font-weight:600}
  .saveitem .amt{margin-left:auto;font-family:var(--font-d);font-weight:700;color:var(--teal);white-space:nowrap}

  .grouph{
    display:flex;align-items:center;gap:10px;margin:26px 0 10px;
  }
  .grouph:first-of-type{margin-top:18px}
  .grouph .gt{font-family:var(--font-d);font-weight:600;font-size:14.5px}
  .grouph .gn{font-family:var(--font-m);font-size:11px;color:var(--faint)}
  .grouph .rule{flex:1;height:1px;background:var(--line)}

  /* ================= CARDS (phone) ================= */
  .cardlist{display:flex;flex-direction:column;gap:9px}
  .pcard{
    background:var(--panel-s);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
    transition:border-color .18s; cursor:pointer;
  }
  .pcard:active{transform:scale(.985)}
  .pcard .r1{display:flex;align-items:flex-start;gap:10px}
  .pcard .nm{font-weight:600;font-size:14px;flex:1;line-height:1.35}
  .pcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .pcard .meta .loc{font-size:11px;color:var(--faint);font-weight:600}
  .pcard .why{
    max-height:0;overflow:hidden;transition:max-height .3s ease,margin .3s ease;
    color:var(--dim);font-size:12.5px;line-height:1.55;
  }
  .pcard.open .why{max-height:300px;margin-top:10px}
  .pcard.open{border-color:rgba(143,125,248,.4)}

  /* ================= RINGS ================= */
  .rings{display:flex;gap:12px;margin-bottom:16px}
  .ringcard{
    flex:1;background:var(--panel-s);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  }
  .ring{position:relative;width:86px;height:86px}
  .ring svg{transform:rotate(-90deg)}
  .ring .rc{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);
    font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
  .ring .rc small{display:block;font-size:9px;color:var(--faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-b)}
  .ringcard .rlab{font-size:11.5px;font-weight:600;color:var(--dim)}
  circle.track{stroke:var(--raised);fill:none}
  circle.prog{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)}

  /* ================= HOME ================= */
  .hero{margin:14px 0 20px}
  body.desktop .hero{margin-top:6px}
  .hero h1{font-family:var(--font-d);font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
  .hero p{color:var(--dim);font-size:14px;margin-top:6px;max-width:560px}
  .hero .date{font-family:var(--font-m);font-size:11px;color:var(--faint);letter-spacing:.06em;margin-bottom:8px}
  .homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  body.desktop .homegrid{grid-template-columns:repeat(4,1fr)}
  .qcard{
    background:var(--panel-s);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;
    display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .18s,border-color .18s;text-align:left;
  }
  .qcard:hover{transform:translateY(-2px);border-color:var(--line2)}
  .qcard .qi{font-size:20px}
  .qcard b{font-family:var(--font-d);font-size:14px;font-weight:600}
  .qcard span{font-size:11.5px;color:var(--dim)}

["PDRN cream / serum (INKEY, Mixsoon, Skin1004)","Glow & Hydration","g","Days","Cosmetic only","$15–30","Sephora","Delivers real hydration and a dewy finish — from the glycerin, HA, panthenol and occlusive base. The PDRN molecule itself (50k–1.5M Da vs the ~500 Da penetration threshold) does not reach the fibroblasts its mechanism depends on.","Fragrance-free versions only. Enjoy it freely — just never as a substitute for the Rejuran sessions, which are the version of PDRN that actually remodels."],
["Snail mucin essence (COSRX Advanced 96)","Glow & Hydration","g","Days","Cosmetic only","$15–25","Ulta","Humectant hydration and a smoother, light-reflecting surface. Well tolerated, layers cleanly under moisturiser.","Fine on tret nights as the buffer layer. No conflict with anything in the core stack."],
["Squalane oil","Glow & Hydration","g","Hours","Cosmetic only","$8–30","Ulta","Seals moisture and adds light reflectivity — the literal 'lit from within' finish, borrowed for a day.","Last step, over moisturiser, PM only. Never between tret and skin — it changes how the tret spreads."],

["Thermal water face mist (Avène, LRP)","Glow & Hydration","g","Hours","Cosmetic only","$12–18","Ulta","Momentary cooling and comfort. In a hot cab it is a legitimate way to take heat out of the face without stripping anything.","Pat dry or seal with moisturiser — letting mist evaporate off bare skin is net drying."],
["Peptide moisturiser (Medik8, The Ordinary Buffet)","Glow & Hydration","g","Days","C — anecdotal","$20–45","Sephora","Mostly a good moisturiser. Signal peptides have plausible mechanism and weak-to-moderate human outcome data — nowhere near retinoid-level, and you already run a retinoid.","Fine as an AM moisturiser swap. Do not pay premium prices expecting tret-scale results."],
["Slugging with Aquaphor / Vaseline","Glow & Hydration","g","Days","B — decent","$0 — own it","Anywhere","Occlusion — cuts transepidermal water loss overnight. Genuinely repairs a barrier stressed by tret, dry cab air and irregular showers.","Over moisturiser, never over bare tret — occlusion increases absorption and irritation. Free; you already own it."],
["Overnight collagen mask (Biodance Deep Mask)","Masks & Patches","g","Days","Cosmetic only","$4–6 each","Ulta","Occlusive hydrogel sheet — traps water against skin overnight. Morning plumpness is water content, not collagen; topical collagen is far too large to penetrate.","The 'wake up glowing' effect is real and reliable. Ideal the night before a date or photos."],
["Calming sheet masks (Torriden, Anua Heartleaf)","Masks & Patches","g","Hours","Cosmetic only","$3–5 each","Ulta","Short burst of hydration plus genuine comfort on a post-tret irritated night. Reduces the redness that would otherwise tempt you into skipping tret.","Fragrance-free only. 15–20 min max — leaving a mask on until it dries pulls water back out of the skin."],
["Under-eye hydrogel patches","Masks & Patches","g","Hours","Cosmetic only","$10–25","Ulta","Temporary de-puff via hydration and mild cooling. Does nothing for pigment or hollowness — Qoves flagged both, and sleep plus the cut are the actual levers there.","You already own these. Best used the morning after a bad sleep night, which OTR guarantees plenty of."],
["Hydrocolloid patches (Mighty Patch)","Masks & Patches","g","1–2 days","B — decent","$8–13","Ulta","Absorbs fluid from a lesion and — far more importantly — physically blocks you from picking it. Picking is the single largest PIH driver on your tone.","Quietly the most genuinely useful item on this entire page. It sits on the Bonus Shelf only because it treats one spot, not the whole face."],
["Ice globes / cold roller","Tools","g","Hours","C — anecdotal","$15–25","Amazon","Vasoconstriction — temporary de-puff and tighter-looking skin for a couple of hours. Feels excellent on a heat-flushed face.","Glide, never drag. Clean before every use. Skip entirely for 2 weeks after Sylfirm."],
["Satin pillowcase / bonnet","Sleep & Accessories","g","Structural","B — decent","$15–20 / 4-pk","Ulta","Low friction — protects edges, and keeps your PM products on your face instead of in the pillow.","Already in the Master Sequence. Listed here so gifted ones are recognised as a genuine yes. Wash every 2–3 nights."],
["Lip mask / overnight lip treatment","Lips","y","1–2 days","B — decent","$10–25","Sephora","Overnight occlusion — genuinely helpful for the Lip Repair Protocol, but only in unflavoured, unscented form.","CONDITION: unflavoured and unscented ONLY. Laneige, Summer Fridays, eos and Burt's Bees are already benched for flavour or mint. Flavour drives lip-licking — the trauma cycle you are actively reversing."],
["Gua sha / facial roller","Tools","y","Hours","C — anecdotal","$10–30","Amazon","Temporary lymphatic de-puff and a pleasant ritual. No lasting contour change — facial 'lifting' claims are not supported.","CONDITION: only over a balm or oil so it glides. Dragging a stone across tret-thinned skin is friction trauma, and friction trauma is how PIH starts on Fitzpatrick V–VI. Never on irritated skin, never within 3 weeks of Sylfirm."],
["Facial steaming","Tools","y","Hours","C — anecdotal","$0–40","Anywhere","Softens surface debris and feels good. Does not 'open pores' — pores have no musculature.","CONDITION: heat is a known trigger for both SD flares and melasma-type pigment. You run SD at 4.5–5/10 and drive a hot cab. Occasional at most, never before a procedure, never followed by extraction."],
["At-home red-light LED mask (Omnilux, Solawave)","Devices","y","Weeks","B — decent","$150–450","Sephora","Red / near-infrared light has moderate evidence for fine lines and wound healing. Home-device effect sizes are modest and slow — months of near-daily use.","CONDITION: RED / near-infrared ONLY. No blue-light mode, ever — visible light drives pigment on your tone. Device must not run warm. Skip for 2 weeks around any procedure. The cut and sleep outrank it."],
["Oral collagen peptides","Oral","y","Weeks","C — anecdotal","$25–45/mo","Amazon","Meta-analyses show small but measurable gains in skin hydration and elasticity. Real and modest — and the great majority of those trials are funded by collagen manufacturers.","CONDITION: count it as protein, not skincare. At ~10 g/day it is a mediocre protein source at a premium price. If it displaces whey or food protein during the cut, it is a net negative."],
["PHA exfoliating toner pads","Pigment","y","Days","C — anecdotal","$15–30","Ulta","Very gentle surface exfoliation. Largely redundant once tretinoin runs nightly — tret already handles turnover.","CONDITION: PHA only (never AHA/BHA pads on the face), max 1×/week, never on a tret night, never within 4 weeks of a procedure. Honestly borderline red — upside over your existing stack is close to zero."],
["Vitamin C 'brightening' mask or ampoule","Pigment","y","Days","B — decent","$5–35","Ulta","A real active in a fun format. Overlaps almost entirely with the Maelove you already run in the AM.","CONDITION: this is an ACTIVE — one new item at a time, 4+ weeks apart. Never the same night as tret. Never store it in the cab; vitamin C oxidises in heat."],
["VT Reedle Shot / any 'spicule' or 'needle' ampoule","Devices","r","Nothing","Harmful on Fitz V–VI","$25–35","Ulta","Contains microscopic sponge spicules that embed in skin to force product penetration. It is deliberate micro-injury sold in a serum bottle.","At-home microneedling wearing a disguise — your protocol already rules that out. Uncontrolled injury depth on V–VI is exactly the PIH trigger the whole system is engineered around. A very popular K-beauty gift: say thank you, then no."],
["Blue-light LED masks or panels","Devices","r","Nothing","Harmful on Fitz V–VI","—","Sephora","Blue and visible light are established drivers of pigmentation in Fitzpatrick IV–VI skin.","Your entire SPF strategy includes iron oxides specifically to block visible light. Buying a device that aims it at your face contradicts the plan. Red / NIR-only devices are the Amber option."],
["At-home dermaroller / microneedling pen (face)","Devices","r","Nothing","Harmful on Fitz V–VI","—","Amazon","Safe depths do not remodel anything; remodelling depths cause controlled injury that cannot be kept sterile outside a clinic.","Already a written rule: one bad pass equals 6–12 months of pigment. Scalp 1.0 mm and mustache 0.25 mm stay — different goal. Sylfirm X is the clinic-grade version, already scheduled."],
["At-home IPL / 'laser' device","Devices","r","Nothing","Harmful on Fitz V–VI","—","Amazon","Targets melanin. On Fitzpatrick V–VI it cannot reliably distinguish the pigment in a spot from the pigment in your skin.","Genuinely dangerous — burns and permanent hypopigmentation. Most home units are explicitly not indicated for deep skin tones. Nd:YAG 1064 in a clinic is the only laser on your safe list."],
["At-home peels (high-% glycolic, TCA, 'peel kits')","Pigment","r","Nothing","Harmful on Fitz V–VI","—","Amazon","Uncontrolled chemical injury with no way to judge depth in real time.","Already on the Skin Protocol no-fly list. Peels on deep skin tones belong to a derm with a Fitzpatrick V–VI portfolio, or to nobody."],
["Skin-lightening / 'whitening' creams (unregulated sellers)","Pigment","r","Nothing","Harmful on Fitz V–VI","—","Anywhere","Frequently contaminated. Regulators have repeatedly found mercury, undeclared hydroquinone and potent steroids such as clobetasol in imported lightening creams.","Documented real harm: mercury toxicity, steroid atrophy, and rebound pigment worse than the starting point. Your pigment plan is tret + azelaic + iron-oxide SPF. That route is safe and it works."],
["Physical scrubs, cleansing brushes, konjac scrubbing","Tools","r","Nothing","Harmful on Fitz V–VI","—","Anywhere","Mechanical trauma to the barrier.","The Lip Repair Protocol identifies repeat-trauma scrubbing as the root cause of the darkening you are currently reversing. Zero scrubbing is already the rule — this entry exists so a gifted 'exfoliating set' gets recognised for what it is."],
["Anything with menthol, camphor or fragrance (face or lips)","Lips","r","Nothing","Harmful on Fitz V–VI","—","Anywhere","The tingle is irritation being marketed as efficacy.","Carmex and medicated ChapStick are already permanently benched. On your tone, every irritation event is a potential pigment event. Fragrance-free above the jaw is non-negotiable."]

function P(name){return PRICE[name]||null}
function money(n){return '$'+(n%1===0?n.toFixed(0):n.toFixed(2))}
function priceCell(name){
  const p=P(name);
  if(!p)return '<span class="punk">Not yet priced</span>';
  if(!p[0])return '<span class="punk">—</span>';
  const est=p[7]?'':' pest';
  const t=p[7]?'':'title="List price carried from the brand’s own page — the next refresh re-verifies it at the retailer."';
  return `<span class="pnow${est}" ${t}>${money(p[0])}</span>`+
    (p[1]?`<span class="pwas">${money(p[1])}</span><span class="psale">Sale</span>`:'')+
    `<span class="psize">${p[2]} · ${p[3]}</span>`;
}
function qtrCell(name){
  const p=P(name);
  if(!p||!p[4])return '<span class="punk">—</span>';
  const one=p[4]<=1;
  return `<span class="qtot">${money(p[5])}</span> <span class="${one?'qone':'qmany'}">${one?'1 buy':p[4]+'×'}</span>`+
    `<span class="qunits">${p[4]===0.5?'one box covers 2 quarters':p[4]+' × '+p[2]+' per 90 days'}</span>`+
    `<span class="qnote">${p[6]}</span>`;
}

function pill(map,k){const p=map[k]||['?','p-w'];return `<span class="pill ${p[1]}"><span class="dot"></span>${p[0]}</span>`}
function rolePills(r){return r.split('').map(x=>pill(ROLE,x)).join(' ')}

function filterRows(rows){
  const q=state.q.toLowerCase();
  return rows.filter(r=>{
    if(state.role!=='all'&&!r[2].includes(state.role))return false;
    if(state.screen!=='all'&&r[3]!==state.screen)return false;
    if(q&&!(r[0]+' '+r[1]+' '+r[4]+' '+r[5]).toLowerCase().includes(q))return false;
    return true;
  });
}

function screenStrip(rows){
  const c=counts(rows);const total=rows.length||1;

function renderBench(k){
  const B=BENCHES[k];const rows=filterRows(B.rows);
  const slots=[...new Set(B.rows.map(r=>r[1]))];
  const phone=document.body.classList.contains('phone');
  let body='';
  if(!rows.length){body=`<div class="empty">Nothing matches — clear a filter or the search.</div>`}
  else{
    body=slots.map(slot=>{
      const sr=rows.filter(r=>r[1]===slot);
      if(!sr.length)return '';
      const head=`<div class="grouph"><span class="gt">${slot}</span><span class="gn">${sr.length}</span><span class="rule"></span></div>`;
      if(phone){
        return head+`<div class="cardlist">`+sr.map(r=>{
          const id=k+'|'+r[0];const p=P(r[0]);
          return `<div class="pcard ${state.open[id]?'open':''}" data-card="${esc(id)}">
            <div class="r1"><div class="nm">${esc(r[0])}</div>${pill(SCREEN,r[3])}</div>
            <div class="meta">${rolePills(r[2])}<span class="loc">${esc(r[4])}</span></div>
            ${p&&p[0]?`<div class="priceline"><span class="lab">Now</span>${priceCell(r[0])}
              ${p[4]?`<span class="lab" style="margin-left:6px">Quarter</span><span class="qtot">${money(p[5])}</span>
              <span class="${p[4]<=1?'qone':'qmany'}">${p[4]<=1?'1 buy':p[4]+'×'}</span>`:''}</div>`:''}
            <div class="why">${esc(r[5])}${p&&p[6]?`<span class="qnote"><b style="color:var(--violet2)">Quarter buy:</b> ${esc(p[6])}</span>`:''}</div>
          </div>`;
        }).join('')+`</div>`;
      }
      return head+`<div class="tablewrap"><div class="tscroll"><table class="bench">
        <thead><tr><th>Product</th><th>Role</th><th>Screen</th><th>Price now</th><th>Per quarter</th><th>Why it fits</th></tr></thead>
        <tbody>${sr.map(r=>`<tr><td class="prod">${esc(r[0])}<span class="psize">${esc(r[4])}</span></td><td style="white-space:nowrap">${rolePills(r[2])}</td><td>${pill(SCREEN,r[3])}</td><td class="pcol">${priceCell(r[0])}</td><td class="qcol">${qtrCell(r[0])}</td><td class="why">${esc(r[5])}</td></tr>`).join('')}</tbody>
      </table></div></div>`;
    }).join('');
  }
  return `<div class="view">
    <div class="vhead"><div class="eyebrow">Sephora &amp; Ulta Variety Bench</div>
      <h1 class="vtitle">${B.icon} ${B.label}</h1><p class="vsub">${B.tag}</p></div>

    ${B.note?`<div class="rulecard" style="margin-top:22px"><b>Bench notes.</b> ${esc(B.note)}</div>`:''}
  </div>`;
}

/* ---------- price watch ---------- */
/* Appended to by the scheduled refresh: {name, date, from, to} */
const PRICE_LOG=[];
function allPriced(){
  const seen={},out=[];
  Object.entries(BENCHES).forEach(([k,B])=>B.rows.forEach(r=>{
    if(seen[r[0]])return; seen[r[0]]=1;
    const p=P(r[0]); if(p&&p[0])out.push({name:r[0],bench:B.icon+' '+B.label,slot:r[1],role:r[2],p});
  }));
  return out;
}
function renderPrices(){
  const q=state.q.toLowerCase();
  const items=allPriced();
  const current=items.filter(i=>i.role.includes('C')&&i.p[4]);
  const leaders=items.filter(i=>i.role.includes('L')&&i.p[4]);
  const curTotal=current.reduce((a,i)=>a+i.p[5],0);
  const leadTotal=leaders.reduce((a,i)=>a+i.p[5],0);
  const verified=items.filter(i=>i.p[7]).length;
  const onSale=items.filter(i=>i.p[1]);
  const unpriced=Object.values(BENCHES).flatMap(b=>b.rows).filter(r=>!P(r[0])&&!/^Skip:/.test(r[0])).length;
  const NEG=/no jumbo|no larger|no bigger/i;
  const POS=/jumbo|32 oz|450 ml|500 ml|20 oz|2-pack|twin pack|XL |refill|6-month|Mega |25 oz|60 ml|larger|bigger/i;
  const bulk=items.filter(i=>POS.test(i.p[6])&&!NEG.test(i.p[6]));
  const shown=q?items.filter(i=>(i.name+i.bench+i.slot).toLowerCase().includes(q)):items;
  const sorted=[...shown].sort((a,b)=>b.p[5]-a.p[5]);
  const clean=s=>s.replace(/ \(current[^)]*\)/,'').split(' · ')[0];
  return `<div class="view">
    <div class="vhead"><div class="eyebrow">Live pricing</div>
    <h1 class="vtitle">💰 Price Watch</h1>
    <p class="vsub">What every bottle costs today, and what it costs to hold that slot for a full 90 days. A quarter buy is one purchase that lasts the quarter — not three months' worth bought at once.</p></div>

    <div class="refreshbar">
      <span class="dotlive"></span>
      <b>Prices verified ${PRICE_META.checked}</b>
      <span>· ${verified} of ${items.length} confirmed at the retailer this run${unpriced?` · ${unpriced} row${unpriced===1?'':'s'} still queued`:''}</span>
      <span class="stamp">AUTO-REFRESH · WEEKLY</span>
    </div>

    <div class="spendgrid">
      <div class="spend"><div class="sk">Your current stack</div><div class="sv">${money(curTotal)}</div><div class="sn">per quarter · ${current.length} products you own</div></div>
      <div class="spend"><div class="sk">All slot leaders</div><div class="sv">${money(leadTotal)}</div><div class="sn">per quarter if you upgraded every slot</div></div>
      <div class="spend"><div class="sk">On sale right now</div><div class="sv">${onSale.length}</div><div class="sn">below list at the retailer</div></div>
      <div class="spend"><div class="sk">Bulk wins</div><div class="sv">${bulk.length}</div><div class="sn">a bigger SKU beats repeat buys</div></div>
    </div>

    <div class="savebox">
      <h3>📦 Buy these in the bigger size</h3>
      <p>Each of these has a larger SKU that covers the whole quarter in one purchase — fewer reorders from the road, and usually cheaper per unit.</p>
      <div class="savelist">${bulk.slice(0,10).map(i=>`<div class="saveitem"><b>${esc(clean(i.name))}</b><span style="flex:1">${esc(i.p[6])}</span><span class="amt">${money(i.p[5])}/qtr</span></div>`).join('')}</div>
    </div>

    <div class="grouph"><span class="gt">🧺 Your current stack — the quarterly restock</span><span class="gn">${money(curTotal)}</span><span class="rule"></span></div>
    <div class="tablewrap">${current.slice().sort((a,b)=>b.p[5]-a.p[5]).map(i=>`<div class="cartrow">
      <div class="cn">${esc(clean(i.name))}<small>${esc(i.slot)} · ${esc(i.p[2])} · ${esc(i.p[3])}</small></div>
      <div class="cq">${i.p[4]===0.5?'½ box':i.p[4]+'×'}</div>
      <div class="cp">${money(i.p[5])}</div></div>`).join('')}
      <div class="cartrow" style="background:rgba(143,125,248,.07)"><div class="cn"><b>Quarterly total, current stack</b></div><div class="cq"></div><div class="cp" style="color:var(--violet2)">${money(curTotal)}</div></div>
    </div>

    <div class="grouph"><span class="gt">📉 Price changes since last check</span><span class="rule"></span></div>
    ${PRICE_LOG.length?`<div class="tablewrap">${PRICE_LOG.map(l=>`<div class="cartrow"><div class="cn">${esc(l.name)}<small>${l.date}</small></div><div class="cp ${l.to>l.from?'dup':'ddn'}">${money(l.from)} → ${money(l.to)}</div></div>`).join('')}</div>`
    :`<div class="rulecard">This is the first price snapshot, so there is nothing to compare against yet. The weekly refresh re-checks every retailer page and records each move here with a ▲ or ▼ against the previous figure — so a sunscreen creeping up, or a sale landing on the Skinfix cream, surfaces without you going looking.</div>`}

    <div class="grouph"><span class="gt">💵 Every priced item, dearest quarter first</span><span class="gn">${sorted.length}</span><span class="rule"></span></div>
    <div class="tablewrap"><div class="tscroll"><table class="bench">
      <thead><tr><th>Product</th><th>Bench</th><th>Price now</th><th>Per quarter</th><th>The quarter buy</th></tr></thead>
      <tbody>${sorted.map(i=>`<tr><td class="prod">${esc(i.name)}</td><td class="wcol">${esc(i.bench)}</td><td class="pcol">${priceCell(i.name)}</td><td class="pcol"><span class="qtot">${money(i.p[5])}</span><span class="qunits">${i.p[4]===0.5?'½ box':i.p[4]+' × '+i.p[2]}</span></td><td class="why">${esc(i.p[6])}</td></tr>`).join('')}</tbody>
    </table></div></div>

    <div class="rulecard" style="margin-top:20px"><b>How to read a quarter price.</b> It is the real cost of keeping that slot filled for 90 days at your usage — SPF reapplied at every three-hour stop, actives PM-only, hair on the Nizoral rotation. A <span class="qone">1 buy</span> badge means one bottle does the whole quarter. A <span class="qmany">3×</span> badge means you reorder mid-quarter, so take the bigger SKU when the note says one exists. Dotted prices are list prices carried from the brand's own page rather than re-checked at the retailer; the weekly refresh promotes them as it confirms them.</div>
  </div>`;
}

/* ---------- home ---------- */
function ring(pct,color,label,center){
  const r=36,c=2*Math.PI*r,off=c*(1-pct);
  return `<div class="ringcard"><div class="ring">
    <svg width="86" height="86" viewBox="0 0 86 86">
      <circle class="track" cx="43" cy="43" r="${r}" stroke-width="8"/>
      <circle class="prog" cx="43" cy="43" r="${r}" stroke-width="8" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg><div class="rc">${center}</div></div>
    <div class="rlab">${label}</div></div>`;
}
function renderHome(){
  const all=Object.values(BENCHES).flatMap(b=>b.rows);
  const total=all.length+BONUS.length+SCENT.lanes.reduce((a,l)=>a+l.rows.length,0);
  const c=counts(all);
  const clearPct=c.g/all.length;
  const leaders=all.filter(r=>r[2].includes('L')).length;
  const currents=all.filter(r=>r[2].includes('C')).length;
  const bg=BONUS.filter(r=>r[2]==='g').length;
  const q=state.q.toLowerCase();
  if(q){ // global search results
    let hits=[];
    const LIGHTPILL={g:'<span class="pill p-g"><span class="dot"></span>✅ Green</span>',y:'<span class="pill p-y"><span class="dot"></span>🟡 Amber</span>',r:'<span class="pill p-r"><span class="dot"></span>🔴 Red</span>'};
    Object.entries(BENCHES).forEach(([k,B])=>B.rows.forEach(r=>{
      if((r[0]+r[1]+r[4]+r[5]).toLowerCase().includes(q))hits.push({t:B.icon+' '+B.label,name:r[0],slot:r[1],why:r[5],pill:pill(SCREEN,r[3]),go:['bench',k]});
    }));
    BONUS.forEach(r=>{if((r[0]+r[1]+r[7]+r[8]).toLowerCase().includes(q))hits.push({t:'🫧 Bonus Shelf',name:r[0],slot:r[1],why:r[7],pill:LIGHTPILL[r[2]],go:['bonus']});});
    return `<div class="view"><div class="vhead"><h1 class="vtitle">Search — “${esc(state.q)}”</h1><p class="vsub">${hits.length} matches across every bench.</p></div>
    <div class="cardlist">${hits.slice(0,60).map(h=>`<div class="pcard open" data-go="${h.go.join(',')}" style="cursor:pointer">
      <div class="r1"><div class="nm">${esc(h.name)}</div>${h.pill}</div>
      <div class="meta"><span class="pill p-v"><span class="dot"></span>${h.t}</span><span class="loc">${esc(h.slot)}</span></div>
      <div class="why" style="max-height:none;margin-top:8px">${esc(h.why)}</div></div>`).join('')||'<div class="empty">No matches anywhere on the bench.</div>'}</div></div>`;
  }
  return `<div class="view">
    <div class="hero">
      <div class="date">AESTHETIC PROTOCOL HQ · COMPILED AUG 26, 2026</div>
      <h1>Everything on your bench is pre-screened. Just pick.</h1>
      <p>${total} products across seven benches + the Bonus Shelf, already filtered for Fitzpatrick V–VI, fragrance-free above the jaw, evidence tier A/B, Sephora/Ulta stock, and the litigation screen. No thinking required at the shelf.</p>
    </div>
    <div class="rings">
      ${ring(clearPct,'var(--teal)','Brands fully clear',`${Math.round(clearPct*100)}<small>%</small>`)}
      ${ring(leaders/all.length,'var(--violet)','Slot leaders picked',`${leaders}<small>⭐</small>`)}
      ${ring(bg/BONUS.length,'var(--amber)','Bonus greens',`${bg}<small>/${BONUS.length}</small>`)}
    </div>
    <div class="statstrip">
      <div class="stat"><div class="k">Bench items</div><div class="v">${all.length}</div></div>
      <div class="stat"><div class="k">🧺 Currently owned</div><div class="v">${currents}</div></div>
      <div class="stat"><div class="k">🔴 To replace</div><div class="v">${all.filter(r=>r[3]==='r').length+1}<small> (Sun Bum lip)</small></div></div>
      <div class="stat"><div class="k">💰 Quarterly restock</div><div class="v">${money(allPriced().filter(i=>i.role.includes('C')&&i.p[4]).reduce((a,i)=>a+i.p[5],0))}<small> current stack</small></div></div>
    </div>
    <section class="homesec"><h2>Jump in</h2><div class="secsub">Every bench is grouped by slot — shop a shelf at a time.</div>
    <div class="homegrid">
      ${Object.entries(BENCHES).map(([k,B])=>`<button class="qcard" data-go="bench,${k}"><span class="qi">${B.icon}</span><b>${B.label}</b><span>${B.tag}</span><span class="qn">${B.rows.length} items →</span></button>`).join('')}
      <button class="qcard" data-go="scent"><span class="qi">🌫️</span><b>Scent Bench</b><span>Two lanes, zero mixing.</span><span class="qn">2 lanes →</span></button>
      <button class="qcard" data-go="bonus"><span class="qi">🫧</span><b>Bonus Shelf</b><span>The "sure, why not" list — honest about what it does.</span><span class="qn">${BONUS.length} items →</span></button>
      <button class="qcard" data-go="proc"><span class="qi">🔁</span><b>Procedure Swaps</b><span>Same job or better, three gates, zero exceptions.</span><span class="qn">3 slots →</span></button>
      <button class="qcard" data-go="brands"><span class="qi">⚖️</span><b>Brands &amp; Audit</b><span>Litigation screen + your current shelf's verdict.</span><span class="qn">${LIT.length} brands →</span></button>
      <button class="qcard" data-go="prices"><span class="qi">💰</span><b>Price Watch</b><span>Today's price on every bottle, plus what one quarter costs.</span><span class="qn">verified ${PRICE_META.checked} →</span></button>
    </div></section>
    <section class="homesec"><h2>The operating rules</h2><div class="secsub">Same rules everywhere — they're why the bench can be trusted blind.</div>
    <div class="rulegrid">
      <div class="rulecard"><b>One swap at a time, 4+ weeks apart.</b> Same rule as procedures, same reason: a reaction has to be traceable.</div>
      <div class="rulecard"><b>8 weeks to earn a seat.</b> A product goes permanent only after 8 weeks with no new pigment, no irritation, no flaking.</div>
      <div class="rulecard"><b>Fragrance-free above the jaw.</b> Non-negotiable. On this tone, irritation is how pigment starts.</div>
      <div class="rulecard"><b>Every day, whichever bottle:</b> cleanse without stripping → antioxidant AM → moisturizer → SPF + stick every 3-hour stop → actives PM only, buffered, never stacked with acids.</div>
    </div></section>
    <div class="sos"><h3>🎒 The "No Bag" plan — pouch forgotten or cooked on the dash</h3>
      <ol>
        <li><b>Priority when you have nothing:</b> 1) protect · 2) don't strip · 3) seal · 4) skip every active. Two days without actives costs nothing; improvised actives can cost 6–12 months of pigment.</li>
        <li><b>Stop A — Ulta/Sephora on the route:</b> Round Lab Dokdo mini or Skinfix Foaming Oil mini · Birch Cream or Atobarrier mini · BOJ Relief Sun · Round Lab Sun Stick. Plus Black Girl Sunscreen, Aquaphor Lip Repair, EltaMD Lip SPF, Kitsch bonnet, Megababe stick.</li>
        <li><b>Stop B — Target/Walmart/CVS:</b> Cetaphil cleanser · Vanicream or Eucerin · BOJ or Isntree sun (Target carries both) · Black Girl Sunscreen face + body · Aquaphor for lips · any satin bonnet · As I Am CoWash + Knot Today.</li>
        <li><b>Stop C — truck stop only:</b> water-only rinse AM/PM · least-fragranced lotion on the shelf · any SPF 30+ beats no sunscreen for one day · hat + long sleeve on the left arm · petroleum jelly for lips.</li>
        <li><b>The permanent fix:</b> a second sealed mini kit in the truck's insulated pouch — never on the dash. All ✅/⚪, ~$90 total, heat-tolerant for a week.</li>
      </ol>
      <div class="never"><b>Never improvised:</b> bar soap on the face · fragranced wipes as cleanser · scrubs or washcloth scrubbing · toothpaste/lemon on a spot · wrong-shade tinted SPF · 2-in-1 shampoo on 4b hair. Never "catch up" by stacking when the bag is back.</div>
    </div>
    <div class="foot">Compiled from <b>Aesthetic Protocol HQ</b> — Sephora &amp; Ulta Variety Bench · Procedure Swap Bench · The Bonus Shelf.<br>Litigation screen re-runs quarterly. Formulas drift: confirm “fragrance-free” on the label in your hand. The bench serves the protocols — the cut still outranks all of it.</div>
  </div>`;
}

function renderMain(){
  const v=state.view;
  $('#main').innerHTML=
    v==='home'?renderHome():
    v==='bench'?renderBench(state.bench):
    v==='scent'?renderScent():
    v==='bonus'?renderBonus():
    v==='proc'?renderProc():
    v==='prices'?renderPrices():
    renderBrands();
  bindChips();
  document.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.card;state.open[id]=!state.open[id];el.classList.toggle('open');
  });
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const [v2,b]=el.dataset.go.split(',');go(v2,b);
  });
  renderNav();renderBottom();
}

/* ============================================================ INIT ============================================================ */
const q1=$('#q1'),q2=$('#q2');
function onSearch(v){state.q=v;q1.value=v;q2.value=v;
  if(state.view!=='home'&&v===''){renderMain();return}
  renderMain();
}
q1.addEventListener('input',e=>onSearch(e.target.value));
q2.addEventListener('input',e=>onSearch(e.target.value));
$('#mDesk').onclick=()=>{setMode('desktop');render()};
$('#mPhone').onclick=()=>{setMode('phone');render()};
let saved=null;try{saved=localStorage.getItem('sb-mode')}catch(e){}
setMode(saved||(matchMedia('(max-width:759px)').matches?'phone':'desktop'),false);
render();

ist)","Ouai Melrose Place / North Bondi 🟡","⭐ Phlur Body Mist (Missing Person / Father Figure) ✅ · Salt & Stone Body Mist ✅ · Glossier You Body Mist ✅"],["Top (cologne, 2 sprays)","Dior Sauvage ✅ · Nautica Voyage ✅ (Ulta)","Bleu de Chanel ✅ · Montblanc Explorer ✅ · JPG Le Male Le Parfum ✅ · Byredo Bal d'Afrique ✅ · Hugo Boss Bottled ✅. Strict-mode skips: YSL, Armani, Prada, Valentino, Azzaro, Margiela (L'Oréal 🟡) · Tom Ford, Le Labo, Jo Malone (Estée Lauder 🟡)."]]},{name:"🍦 Lane B — Warm / Gourmand",rows:[["Base (wash)","Native Coconut & Vanilla 🟡 (P&G)","⭐ Kopari Coconut Body Wash (Ulta) ✅ · Sol de Janeiro Bum Bum Body Wash ✅"],["Lock","Sol de Janeiro Bum Bum Cream (Cheirosa 62) ✅","⭐ Kopari Coconut Melt (Ulta) ✅ · SdJ Cheirosa 71 Body Cream ✅ · Tree Hut Shea Body Butter (Ulta) ✅"],["Movement","SdJ Cheirosa 62 Mist ✅","Kayali Vanilla 28 Hair & Body Mist ✅ · Phlur Vanilla Skin Mist ✅ · Ellis Brooklyn Vanilla Milk Mist ✅"],["Top","light vanilla-amber","Versace Eros (Ulta) ✅ · Dior Sauvage Elixir ✅ · Kayali Vanilla 28 EDP ✅ · Rabanne 1 Million Elixir (Ulta) ✅"]]}],d=[["PDRN cream / serum (INKEY, Mixsoon, Skin1004)","Glow & Hydration","g","Days","Cosmetic only","$15–30","Sephora","Delivers real hydration and a dewy finish — from the glycerin, HA, panthenol and occlusive base. The PDRN molecule itself (50k–1.5M Da vs the ~500 Da penetration threshold) does not reach the fibroblasts its mechanism depends on.","Fragrance-free versions only. Enjoy it freely — just never as a substitute for the Rejuran sessions, which are the version of PDRN that actually remodels."],["Snail mucin essence (COSRX Advanced 96)","Glow & Hydration","g","Days","Cosmetic only","$15–25","Ulta","Humectant hydration and a smoother, light-reflecting surface. Well tolerated, layers cleanly under moisturiser.","Fine on tret nights as the buffer layer. No conflict with anything in the core stack."],["Squalane oil","Glow & Hydration","g","Hours","Cosmetic only","$8–30","Ulta","Seals moisture and adds light reflectivity — the literal 'lit from within' finish, borrowed for a day.","Last step, over moisturiser, PM only. Never between tret and skin — it changes how the tret spreads."],["Rice / oat hydrating toner (Anua Rice 70, I'm From)","Glow & Hydration","g","Hours","Cosmetic only","$15–22","Ulta","Humectant prep layer — makes everything after it spread better and makes skin look immediately less dull.","Fragrance-free versions only. Adds a step — skip it on road-minimum days without guilt."],["Thermal water face mist (Avène, LRP)","Glow & Hydration","g","Hours","Cosmetic only","$12–18","Ulta","Momentary cooling and comfort. In a hot cab it is a legitimate way to take heat out of the face without stripping anything.","Pat dry or seal with moisturiser — letting mist evaporate off bare skin is net drying."],["Peptide moisturiser (Medik8, The Ordinary Buffet)","Glow & Hydration","g","Days","C — anecdotal","$20–45","Sephora","Mostly a good moisturiser. Signal peptides have plausible mechanism and weak-to-moderate human outcome data — nowhere near retinoid-level, and you already run a retinoid.","Fine as an AM moisturiser swap. Do not pay premium prices expecting tret-scale results."],["Slugging with Aquaphor / Vaseline","Glow & Hydration","g","Days","B — decent","$0 — own it","Anywhere","Occlusion — cuts transepidermal water loss overnight. Genuinely repairs a barrier stressed by tret, dry cab air and irregular showers.","Over moisturiser, never over bare tret — occlusion increases absorption and irritation. Free; you already own it."],["Overnight collagen mask (Biodance Deep Mask)","Masks & Patches","g","Days","Cosmetic only","$4–6 each","Ulta","Occlusive hydrogel sheet — traps water against skin overnight. Morning plumpness is water content, not collagen; topical collagen is far too large to penetrate.","The 'wake up glowing' effect is real and reliable. Ideal the night before a date or photos."],["Calming sheet masks (Torriden, Anua Heartleaf)","Masks & Patches","g","Hours","Cosmetic only","$3–5 each","Ulta","Short burst of hydration plus genuine comfort on a post-tret irritated night. Reduces the redness that would otherwise tempt you into skipping tret.","Fragrance-free only. 15–20 min max — leaving a mask on until it dries pulls water back out of the skin."],["Under-eye hydrogel patches","Masks & Patches","g","Hours","Cosmetic only","$10–25","Ulta","Temporary de-puff via hydration and mild cooling. Does nothing for pigment or hollowness — Qoves flagged both, and sleep plus the cut are the actual levers there.","You already own these. Best used the morning after a bad sleep night, which OTR guarantees plenty of."],["Hydrocolloid patches (Mighty Patch)","Masks & Patches","g","1–2 days","B — decent","$8–13","Ulta","Absorbs fluid from a lesion and — far more importantly — physically blocks you from picking it. Picking is the single largest PIH driver on your tone.","Quietly the most genuinely useful item on this entire page. It sits on the Bonus Shelf only because it treats one spot, not the whole face."],["Ice globes / cold roller","Tools","g","Hours","C — anecdotal","$15–25","Amazon","Vasoconstriction — temporary de-puff and tighter-looking skin for a couple of hours. Feels excellent on a heat-flushed face.","Glide, never drag. Clean before every use. Skip entirely for 2 weeks after Sylfirm."],["Satin pillowcase / bonnet","Sleep & Accessories","g","Structural","B — decent","$15–20 / 4-pk","Ulta","Low friction — protects edges, and keeps your PM products on your face instead of in the pillow.","Already in the Master Sequence. Listed here so gifted ones are recognised as a genuine yes. Wash every 2–3 nights."],["Lip mask / overnight lip treatment","Lips","y","1–2 days","B — decent","$10–25","Sephora","Overnight occlusion — genuinely helpful for the Lip Repair Protocol, but only in unflavoured, unscented form.","CONDITION: unflavoured and unscented ONLY. Laneige, Summer Fridays, eos and Burt's Bees are already benched for flavour or mint. Flavour drives lip-licking — the trauma cycle you are actively reversing."],["Gua sha / facial roller","Tools","y","Hours","C — anecdotal","$10–30","Amazon","Temporary lymphatic de-puff and a pleasant ritual. No lasting contour change — facial 'lifting' claims are not supported.","CONDITION: only over a balm or oil so it glides. Dragging a stone across tret-thinned skin is friction trauma, and friction trauma is how PIH starts on Fitzpatrick V–VI. Never on irritated skin, never within 3 weeks of Sylfirm."],["Facial steaming","Tools","y","Hours","C — anecdotal","$0–40","Anywhere","Softens surface debris and feels good. Does not 'open pores' — pores have no musculature.","CONDITION: heat is a known trigger for both SD flares and melasma-type pigment. You run SD at 4.5–5/10 and drive a hot cab. Occasional at most, never before a procedure, never followed by extraction."],["At-home red-light LED mask (Omnilux, Solawave)","Devices","y","Weeks","B — decent","$150–450","Sephora","Red / near-infrared light has moderate evidence for fine lines and wound healing. Home-device effect sizes are modest and slow — months of near-daily use.","CONDITION: RED / near-infrared ONLY. No blue-light mode, ever — visible light drives pigment on your tone. Device must not run warm. Skip for 2 weeks around any procedure. The cut and sleep outrank it."],["Oral collagen peptides","Oral","y","Weeks","C — anecdotal","$25–45/mo","Amazon","Meta-analyses show small but measurable gains in skin hydration and elasticity. Real and modest — and the great majority of those trials are funded by collagen manufacturers.","CONDITION: count it as protein, not skincare. At ~10 g/day it is a mediocre protein source at a premium price. If it displaces whey or food protein during the cut, it is a net negative."],["PHA exfoliating toner pads","Pigment","y","Days","C — anecdotal","$15–30","Ulta","Very gentle surface exfoliation. Largely redundant once tretinoin runs nightly — tret already handles turnover.","CONDITION: PHA only (never AHA/BHA pads on the face), max 1×/week, never on a tret night, never within 4 weeks of a procedure. Honestly borderline red — upside over your existing stack is close to zero."],["Vitamin C 'brightening' mask or ampoule","Pigment","y","Days","B — decent","$5–35","Ulta","A real active in a fun format. Overlaps almost entirely with the Maelove you already run in the AM.","CONDITION: this is an ACTIVE — one new item at a time, 4+ weeks apart. Never the same night as tret. Never store it in the cab; vitamin C oxidises in heat."],["VT Reedle Shot / any 'spicule' or 'needle' ampoule","Devices","r","Nothing","Harmful on Fitz V–VI","$25–35","Ulta","Contains microscopic sponge spicules that embed in skin to force product penetration. It is deliberate micro-injury sold in a serum bottle.","At-home microneedling wearing a disguise — your protocol already rules that out. Uncontrolled injury depth on V–VI is exactly the PIH trigger the whole system is engineered around. A very popular K-beauty gift: say thank you, then no."],["Blue-light LED masks or panels","Devices","r","Nothing","Harmful on Fitz V–VI","—","Sephora","Blue and visible light are established drivers of pigmentation in Fitzpatrick IV–VI skin.","Your entire SPF strategy includes iron oxides specifically to block visible light. Buying a device that aims it at your face contradicts the plan. Red / NIR-only devices are the Amber option."],["At-home dermaroller / microneedling pen (face)","Devices","r","Nothing","Harmful on Fitz V–VI","—","Amazon","Safe depths do not remodel anything; remodelling depths cause controlled injury that cannot be kept sterile outside a clinic.","Already a written rule: one bad pass equals 6–12 months of pigment. Scalp 1.0 mm and mustache 0.25 mm stay — different goal. Sylfirm X is the clinic-grade version, already scheduled."],["At-home IPL / 'laser' device","Devices","r","Nothing","Harmful on Fitz V–VI","—","Amazon","Targets melanin. On Fitzpatrick V–VI it cannot reliably distinguish the pigment in a spot from the pigment in your skin.","Genuinely dangerous — burns and permanent hypopigmentation. Most home units are explicitly not indicated for deep skin tones. Nd:YAG 1064 in a clinic is the only laser on your safe list."],["At-home peels (high-% glycolic, TCA, 'peel kits')","Pigment","r","Nothing","Harmful on Fitz V–VI","—","Amazon","Uncontrolled chemical injury with no way to judge depth in real time.","Already on the Skin Protocol no-fly list. Peels on deep skin tones belong to a derm with a Fitzpatrick V–VI portfolio, or to nobody."],["Skin-lightening / 'whitening' creams (unregulated sellers)","Pigment","r","Nothing","Harmful on Fitz V–VI","—","Anywhere","Frequently contaminated. Regulators have repeatedly found mercury, undeclared hydroquinone and potent steroids such as clobetasol in imported lightening creams.","Documented real harm: mercury toxicity, steroid atrophy, and rebound pigment worse than the starting point. Your pigment plan is tret + azelaic + iron-oxide SPF. That route is safe and it works."],["Physical scrubs, cleansing brushes, konjac scrubbing","Tools","r","Nothing","Harmful on Fitz V–VI","—","Anywhere","Mechanical trauma to the barrier.","The Lip Repair Protocol identifies repeat-trauma scrubbing as the root cause of the darkening you are currently reversing. Zero scrubbing is already the rule — this entry exists so a gifted 'exfoliating set' gets recognised for what it is."],["Anything with menthol, camphor or fragrance (face or lips)","Lips","r","Nothing","Harmful on Fitz V–VI","—","Anywhere","The tingle is irritation being marketed as efficacy.","Carmex and medicated ChapStick are already permanently benched. On your tone, every irritation event is a potential pigment event. Fragrance-free above the jaw is non-negotiable."]],f=[["GATE 1","Same job or better","Matches the slot's output: tone / texture / reflectivity."],["GATE 2","Equal or lower pigment + scar risk on V–VI","Non-negotiable. This gate kills most of the industry."],["GATE 3","No long-term repercussions","Short-term downtime fine; anything irreversible, cumulative-damage, or multi-year-committed is out. The standard is decades, not seasons."]],p=["<b>Profhilo</b> — not FDA-approved. Evolus signed a July 2026 deal with IBSA to bring it through approval; their own filing implies launch beyond 2026. A US clinic offering it today is using gray-market imported product — unregulated supply chain, no recourse.","<b>Rejuran (PN/PDRN injectable)</b> — not approved for aesthetic injection in the US. Topical PDRN is legal as a cosmetic; the syringe is not.","<b>Sylfirm X</b> — ✅ FDA-cleared. Fully bookable at any reputable US practice.","<b>Not a plan-killer — a routing problem.</b> US-legal swap (default) · Passport route (Profhilo & Rejuran are standard-of-care in Thailand and Korea — your 2027–28 trips make it nearly free in logistics) · Wait for the launch (the slot doesn't expire; Skinvive holds it)."],h=[["Eczema on chart (active, dx 2018)",'An atopic barrier flares harder and pigments easier. Hard rule: no needling procedure on skin that hasn\'t been flare-free for 2+ weeks. Say the word "eczema" at every consult.'],["Excedrin contains aspirin","Skip it for ~7 days before any injectable or needling session (bruising/bleeding), alongside the fish-oil pause in the T-5 protocol. Plain acetaminophen is the swap that week."],["Lidocaine + anesthesia tolerated (Feb 2026)","No drug allergies on file. Topical numbing for Sylfirm X is a green light."],["Scar-quality check before first RF session","Documented trauma scarring (2019). Flat and faded = proceed; raised, thick, or growing past the wound edge = tell the provider — keloid-prone skin changes the entire microneedling conversation on V–VI."]],m=[{name:"Slot 1 — Sylfirm X",color:"red",job:'The job: texture + pores + early laxity + pigment, one modality. The slot is really "insulated-needle RF microneedling" — Sylfirm X is one brand sitting in it. Peer-reviewed skin-of-color data backs the class, not just the logo.',swaps:[["Genius (Lutronic)","Full 1:1. Insulated needles, real-time impedance feedback — arguably the best-instrumented device in the class.","$600–1,200","g","Equal or better"],["Secret RF","Full 1:1. Insulated needles, widely available, often cheaper.","$500–1,000","g","Equal"],["Potenza (insulated tips)","Full 1:1 if the practice uses insulated tips — confirm before booking, it runs both.","$600–1,200","g","Equal, one question to ask"],["EndyMed Intensif / Vivace","Same class, solid track record.","$500–1,000","g","Equal"],["Morpheus8","The famous one — but it runs deeper, coagulates fat, and carries more reported grid-pattern PIH on darker skin than the pulsed platforms.","$800–1,500","y","Only with a V–VI portfolio provider"],["Professional microneedling (SkinPen)","~70% of the job at ~30% of the price. Texture + pores + pigment, no RF tightening.","$200–400","y","Budget bench"],["Nd:YAG 1064 laser toning","Pigment slice only. Already your rescue laser — can substitute the pigment portion of a skipped Sylfirm year.","$250–500","y","Partial (tone)"],["Pico 1064 (PicoWay)","Pigment + subtle texture, minimal heat. The gentlest laser option for V–VI tone work.","$400–800","y","Partial (tone)"],["Low-density 1927nm thulium (LaseMD Ultra / Moxi)","Glow + pigment; published success treating PIH in skin of color — but it is an epidermal laser, so the margin for provider error is thinner than RF.","$500–900","r","Conditional — SOC-expert only, low density, test spot"],["Salicylic / mandelic peel series","Tone + texture maintenance between device years. The two acids with the best V–VI safety record.","$100–200 ×4–6","y","Budget bench"],["HIFU (Sofwave / Ultherapy)","Laxity only, color-blind. At 25 with no laxity complaint, it solves a problem you don't have.","$1,500–3,500","w","Not yet — file for your 30s"]],closed:"Bench permanently closed: IPL/BBL · ablative CO2 · alexandrite/ruby · deep TCA · high-density 1550/1927 · at-home microneedling. No price or provider reopens these on your tone."},{name:"Slot 2 — Profhilo",color:"teal",job:'The job: the "lit from within" reflectivity — deep hydration and skin-quality remodeling with zero epidermal injury.',swaps:[["Skinvive (Juvéderm)","The only FDA-approved microdroplet HA skin booster in the US. Same goal, different geometry — intradermal microdroplets across the cheeks vs Profhilo's 5-point spread. ~6-month duration. The US-legal 1:1.","$600–900","g","The default US swap"],["Profhilo abroad 🇹🇭🇰🇷🇬🇧","The original, where it's licensed. Bangkok/Seoul pricing often beats US gray-market. Schedule ≥48h before flights and away from hard training days.","$300–600 abroad","g","Passport route"],["Restylane Skinboosters","Same class, long track record in Europe/Asia — but also not FDA-approved in the US. Abroad-only option.","$400–700 abroad","y","Abroad bench"],["NCTF 135HA mesotherapy","HA + vitamin cocktail microinjections. Weaker evidence base, more sessions, popular in EU/Asia.","$200–400 ×3+","y","Thin evidence"],["Hyperdilute Sculptra / biostimulators","Often pitched as the \"better Profhilo.\" It isn't for you: poly-L-lactic acid commits your face for 2+ years, isn't dissolvable, and carries a nodule tail-risk.","$800–1,500","r","Fails Gate 3 — bench closed"]],closed:""},{name:"Slot 3 — Rejuran",color:"blue",job:"The job: texture + elasticity + repair signaling (polynucleotides), near-zero pigment risk.",swaps:[["Microneedling + topical PDRN/exosomes (same visit)","The US-legal replica: open microchannels, then flood them with topical PDRN or exosome serum. Evidence younger than injected PN, but the same biology delivered legally — and it piggybacks on a session already in the calendar.","+$100–300 on a needling session","g","The default US swap"],["Rejuran abroad 🇰🇷🇹🇭","The original, in the countries that invented the category. Korea is the world's deepest bench of Rejuran injectors; Thailand close behind.","$150–400 / session abroad","g","Passport route"],["Plinest / Nucleofill","The Italian originals of the polynucleotide class — same molecule family, licensed in Europe/UK.","$250–500 abroad","y","Abroad bench"],["Skinvive","Covers the hydration/reflectivity share of the job, not the regenerative-signaling share.","$600–900","y","Partial"],["PRF (not PRP) under-eye","Autologous — your own blood, zero product-regulation issue, zero allergy risk. Earns a look only if under-eye texture becomes a specific complaint.","$500–800","y","Situational only"]],closed:""}],g=[["🇺🇸 US-Legal Year (default)","$1,800–2,800",["Jan–Feb|Insulated RF microneedling (any 🟢 device)","Apr–May|Skinvive","Jun–Aug|Blackout — nothing","Oct–Nov|Microneedling + PDRN/exosome topical"]],["🛂 Passport Year (2027+)","$1,200–2,200",["Jan–Feb|Sylfirm X at home","Apr–May|Profhilo #1 (Bangkok/Seoul trip)","Jun–Aug|Blackout — nothing","Oct–Nov|Rejuran or Profhilo #2 (trip #2)"]],["💰 Budget Year","$900–1,600",["Jan–Feb|SkinPen microneedling series","Apr–May|Peel series or Nd:YAG toning","Jun–Aug|Blackout — nothing","Oct–Nov|Microneedling + PDRN topical"]],["👑 Original Plan","$2,000–3,500",["Jan–Feb|Sylfirm X","Apr–May|Profhilo #1 (gray-market in US — see Regulatory Reality)","Jun–Aug|Blackout — nothing","Oct–Nov|Rejuran or Profhilo #2"]]],y=["Evolus wins Profhilo FDA approval → Skinvive rows demote to bench, Profhilo becomes the US starter. Watch for the announcement (2027+).","US PN/PDRN injectable approval → same promotion for the Rejuran slot.","Any raised or keloid scarring found at the scar check → all needling rows freeze until a derm clears them.","Eczema flare pattern worsens → injectable-only years (Skinvive/Profhilo) are the fallback; they don't touch the barrier."],b=[["Anua · Beauty of Joseon · COSRX · Skin1004 · Round Lab · Medicube · Isntree · Torriden · Aestura · Laneige · Innisfree","g","K-beauty (Amorepacific for COSRX/Aestura/Laneige/Innisfree). No litigation found."],["Topicals · Hyper Skin · Eadem · Tower 28 · Fenty Skin · Ilia · Skinfix · Nécessaire · Dieux · Salt & Stone · Good Molecules · The Inkey List · Peach & Lily · Bubble · Byoma · Vacation · Megababe · Kitsch · Slip","g","No litigation found."],["As I Am · Kinky-Curly · Cantu · Tropic Isle Living · TGIN · Melanin Haircare · Pattern · Bread · Adwoa · The Doux · Camille Rose · Briogeo · Jupiter · Every Man Jack · Duke Cannon · Anastasia · Cetaphil · Differin","g",'No active litigation found (Camille Rose 2018 "natural" labeling suit, closed).'],["Sol de Janeiro (L'Occitane)","g","Only suits are ones it filed against dupe brands, plus a TCPA text case — nothing about product safety or use."],["CeraVe · La Roche-Posay · Kiehl's · SkinCeuticals · YTTP · NYX · Baxter (L'Oréal)","y","Six class actions pending over benzene in CeraVe Acne Foaming cleansers and LRP Effaclar Duo (benzoyl-peroxide products only); separate hair-relaxer litigation. Your Hydrating Cleanser, Moisturizing Lotion and Anthelios are not named products."],["Neutrogena · Aveeno · OGX · Nizoral · Ambi (Kenvue)","y","OGX hair-loss class components mostly settled; individual injury claims continue. Neutrogena benzene sunscreen suits settled."],["Ouai · Native · Olay · Head & Shoulders · First Aid Beauty (P&G)","y","Brands clean; parent carries the active Mielle litigation."],["Shea Moisture · Vaseline · Dove · Paula's Choice · Dermalogica · Murad · Tatcha · K18 · Nutrafol (Unilever)","y",'TRESemmé DMDM-hydantoin hair-loss cases still active in 2026; Dove Sensitive "hypoallergenic" suit May 2026; Paula\'s Choice "Made in USA" suit 2025.'],["The Ordinary · Clinique · Dr. Jart · Aveda · Le Labo · Tom Ford (Estée Lauder)","y","Clinique named in the benzoyl-peroxide/benzene actions. The Ordinary itself is clean."],["e.l.f. · Naturium · Rhode (e.l.f.)","y","Slack-fill suit on two e.l.f. SKUs (2025). Naturium itself clean."],["Banana Boat · Hawaiian Tropic · Jack Black · Cremo · Bulldog (Edgewell)","y","State false-advertising action over reef-sa
